name: Validate project records

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Rebuild statistics from archived exports
        run: python tools/summarize_exports.py
      - name: Check source and documentation
        run: python tools/check_project.py
      - name: Verify recorded summary is current
        run: git diff --exit-code -- experiments/summary.json
